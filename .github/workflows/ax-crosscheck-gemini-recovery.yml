name: AX crosscheck Gemini position recovery
on:
  push:
    branches: [research/four-llm-crosscheck-20261123]
    paths: [.github/workflows/ax-crosscheck-gemini-recovery.yml]
permissions:
  contents: read
concurrency:
  group: ax-crosscheck-gemini-recovery
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 40
