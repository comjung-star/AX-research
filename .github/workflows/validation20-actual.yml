name: AX New20 actual frozen-validation run
on:
  push:
    branches: [research/new20-validation-20261107]
    paths:
      - '.github/workflows/validation20-actual.yml'
  workflow_dispatch:
concurrency:
  group: ax-new20-actual-frozen
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BGE_MODEL_PATH: ${{ runner.temp }}/bge-m3-frozen
      TOKENIZERS_PARALLELISM: 'false'
      HF_HUB_DISABLE_TELEMETRY: '1'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - name: Checkout full research history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Free runner disk before BGE-M3 download
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h
      - name: Install frozen CPU inference packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.12.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.4.5' 'transformers==5.12.0' 'sentence-transformers==5.7.0' 'kiwipiepy>=0.20' 'huggingface_hub>=0.30' 'PyYAML>=6.0'
          python -m pip install -e . --no-deps
      - name: Download BGE-M3 weights into the runner
        shell: bash
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          location=snapshot_download(repo_id='BAAI/bge-m3',
              local_dir=os.environ['BGE_MODEL_PATH'],
              allow_patterns=['pytorch_model.bin','1_Pooling/*','config.json',
                  'config_sentence_transformers.json','modules.json',
                  'sentence_bert_config.json','sentencepiece.bpe.model',
                  'special_tokens_map.json','tokenizer.json','tokenizer_config.json'])
          print('BGE_M3_MODEL_PATH_READY',location)
          PY
      - name: Check original frozen weights and protected corpus before paid API calls
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.heldout_run import freeze
          model=Path(os.environ['BGE_MODEL_PATH'])
          result=freeze(model)
          print('FROZEN_MODEL_SHA256_AND_SOURCE_MATCH',len(result['model']))
          print('FROZEN_PACKAGES_MATCH',result['packages'])
          PY
      - name: Generate new20 C/X/E views, bounded to $2 total API budget
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -m scripts.validation20_pipeline generate
      - name: Run new20 BGE-M3 Dense+Sparse / functional C/E inference
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -m scripts.validation20_pipeline infer
      - name: Blind AI relevance evaluation for 20x112 pairs
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -m scripts.validation20_pipeline judge
      - name: Independently review 20x112 pairs with different OpenAI model (same total $2 cap)
        shell: bash
        continue-on-error: true
        run: |
          export PYTHONPATH=src:.
          python -m scripts.validation20_pipeline judge2
      - name: Compare E / I2 / I3 using actual new20 predictions and blinded labels
        shell: bash
        run: |
          export PYTHONPATH=src:.
          python -m scripts.validation20_pipeline compare
      - name: Preserve all actual experiment traces and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-new20-actual-validation
          path: docs/validation-new20-20261107/run/
          retention-days: 90
          if-no-files-found: warn
      - name: Persist small outputs from successful or partial execution in research branch
        if: always()
        shell: bash
        run: |
          set -e
          dir=docs/validation-new20-20261107/run
          if [ ! -d "$dir" ]; then exit 0; fi
          for file in api_ledger.json generation_finished.json new20_prediction_ready.json predictions.json prediction_seal.json labels.json labels_second.json primary_review_status.json blind_luna.json blind_terra.json blind_agreement.json validation_luna.json validation_terra.json validation_agreement.json reviewer_agreement.json final_status.json; do
            if [ -f "$dir/$file" ]; then git add -f "$dir/$file"; fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "NO_SMALL_OUTPUTS_TO_COMMIT"
          else
            git commit -m "validation: preserve actual New20 execution outputs"
            git push origin HEAD:research/new20-validation-20261107
          fi
