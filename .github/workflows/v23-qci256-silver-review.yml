name: AX v23 four step review
on:
  push:
    branches:
      - experiment/v23-qci-256-four-step-20261024
    paths:
      - .github/workflows/v23-qci256-silver-review.yml
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=3.26.0' 'pydantic>=2.7'
      - run: python scripts/v23_four_step_review.py
      - name: Commit review outputs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_qci256_four_step/
          git commit -m 'results: third silver review and training labels'
          git push
