name: RQ1 BM25 and Dense baselines

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-${{ runner.os }}

      - name: Install CPU retrieval dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install             "numpy>=1.26"             "PyYAML>=6.0"             "kiwipiepy>=0.20"             "rank-bm25>=0.2.2"             "sentence-transformers>=3.0"

      - name: Run BM25 baseline
        run: |
          python -m ax_research.cli bm25 --output-dir experiments/rq1_retrieval/results/rq1_v1_2_baseline

      - name: Run Dense baseline
        run: |
          python -m ax_research.cli dense --output-dir experiments/rq1_retrieval/results/rq1_v1_2_baseline

      - name: Persist baseline results in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rq1_retrieval/results/rq1_v1_2_baseline
          if git diff --cached --quiet; then
            echo "No baseline result changes."
          else
            git commit -m "results: refresh RQ1 v1.2 baselines"
            git push
          fi

      - name: Upload baseline results
        uses: actions/upload-artifact@v4
        with:
          name: rq1-baseline-results
          path: experiments/rq1_retrieval/results/rq1_v1_2_baseline
