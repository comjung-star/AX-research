name: AX v2.3 full union then Top-M exploratory replay
on:
  push:
    branches:
      - experiment/v23-hybrid-full-union-topm-20261024
    paths:
      - .github/workflows/v23-full-union-topm.yml
      - scripts/v23_full_union_topm.py
      - scripts/v23_full_union_topm_report.py
      - tests/test_v23_full_union_topm.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  full-union-topm:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only numeric dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . numpy pytest
      - name: Check full-union Top-M invariants
        run: python -m pytest -q tests/test_v23_full_union_topm.py tests/test_v23_professor_hybrid_preserving.py
      - name: Frozen Full Dense + Sparse Union before Top-M replay
        run: python scripts/v23_full_union_topm.py
      - name: Evaluate perspective-specific Top-K unions
        run: python scripts/v23_full_union_topm_report.py
      - name: Commit dedicated Dev output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v23_full_union_topm/
          git diff --cached --quiet && exit 0
          git commit -m "results(v2.3): explore full Dense Sparse union before Top-M"
          git push
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-full-union-topm
          path: experiments/v23_full_union_topm/
          if-no-files-found: warn
