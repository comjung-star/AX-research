name: AX v2.3 Stage1 perspective separation replay
on:
  push:
    branches:
      - experiment/v23-stage1-perspective-separation-20261024
    paths:
      - .github/workflows/v23-stage1-perspective-separation.yml
      - scripts/v23_stage1_perspective_separation.py
      - tests/test_v23_stage1_perspective_separation.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  frozen-stage1-reanalysis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install analysis tools
        run: python -m pip install numpy pytest
      - name: Stage1 view-preservation tests
        run: PYTHONPATH=src:. python -m pytest -q tests/test_v23_stage1_perspective_separation.py
      - name: Replay original Stage1 and analyze view separation
        run: PYTHONPATH=src:. python scripts/v23_stage1_perspective_separation.py
      - name: Commit analysis results without altering frozen source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_stage1_perspective_separation/
          git diff --cached --quiet && exit 0
          git commit -m 'results: stage1 separated branch Top-K and equal-budget comparisons'
          git push
      - name: Archive analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-stage1-perspective-separated
          path: experiments/v23_stage1_perspective_separation/
          if-no-files-found: warn
