name: AX Dataset v2.1 Freeze and Dev Smoke

on:
  push:
    paths:
      - 'data/v2_1/**'
      - 'data/v2/qa/**'
      - 'scripts/validate_v21_freeze.py'
      - 'scripts/v21_retrieval_smoke.py'
      - 'tests/test_v21_pipeline.py'
      - 'experiments/rq3_evidence/results/v21_wald_contingency_2026-10-22.csv'
      - '.github/workflows/validate-v21.yml'
  pull_request:
    paths:
      - 'data/v2_1/**'
      - 'data/v2/qa/**'
      - 'scripts/validate_v21_freeze.py'
      - 'scripts/v21_retrieval_smoke.py'
      - 'tests/test_v21_pipeline.py'
      - 'experiments/rq3_evidence/results/v21_wald_contingency_2026-10-22.csv'
      - '.github/workflows/validate-v21.yml'

jobs:
  frozen-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate 91-case frozen snapshot and untouched Ground Truth
        run: python scripts/validate_v21_freeze.py
      - name: Run no-dependency retrieval/evidence trace smoke tests
        run: python -m unittest discover -s tests -p 'test_v21_pipeline.py' -v
      - name: Generate diagnostic retrieval sample (NOT a quality experiment)
        run: |
          python scripts/v21_retrieval_smoke.py --backend char_ngram --query-text "Manual factory production quotation and scheduling requires too much human effort" --output experiments/rq1_retrieval/results/v21_diagnostic_smoke.json
      - uses: actions/upload-artifact@v4
        with:
          name: ax-v21-wiring-diagnostic
          path: experiments/rq1_retrieval/results/v21_diagnostic_smoke.json
          retention-days: 30
