name: Stage 3-1 Wald Evidence Dev Diagnostics

on:
  pull_request:
    paths:
      - "src/ax_research/stage3_wald.py"
      - "tests/test_stage3_wald.py"
      - ".github/workflows/stage3-wald-dev.yml"
      - "docs/experiment-spec-stage3-factor-wald-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-wald:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Run focused Stage 3 Wald unit tests
        run: pytest -q tests/test_stage3_wald.py
      - name: Produce frozen offline Wald diagnostics
        run: |
          python -m ax_research.stage3_wald \
            --cases data/main_cases_v1.csv \
            --factors data/root_cause_factors_v1.csv \
            --strategies data/strategy_taxonomy_v1.csv \
            --output-dir experiments/rq3_evidence/results/stage3_wald_v1
      - name: Upload diagnostic tables
        uses: actions/upload-artifact@v4
        with:
          name: stage3-wald-v1-diagnostics
          path: experiments/rq3_evidence/results/stage3_wald_v1/
          if-no-files-found: error
