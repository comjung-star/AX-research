name: AX v2.3 blind AI Dev silver labeling
on:
  push:
    branches: [experiment/v23-ground-truth-20261023]
    paths:
      - '.github/workflows/v23-ai-silver-ground-truth.yml'
      - 'scripts/v23_gt_grade.py'
      - 'scripts/v23_gt_build.py'
permissions:
  contents: write
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        query: [V21D001, V21D002, V21D003, V21D004, V21D005, V21D006, V21D007, V21D008, V21D009, V21D010]
        pass: [1, 2, 3]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=3.26.0' 'pydantic>=2.7'
      - name: Score only query/problem/task/context for 84 frozen cases
        run: |
          python scripts/v23_gt_grade.py \
            --query-id ${{ matrix.query }} \
            --pass-id ${{ matrix.pass }} \
            --model gpt-6-luna \
            --output-dir data/v2_3/ground_truth/v23-gt-${{ matrix.query }}-p${{ matrix.pass }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-gt-${{ matrix.query }}-p${{ matrix.pass }}
          path: data/v2_3/ground_truth/v23-gt-${{ matrix.query }}-p${{ matrix.pass }}
          retention-days: 90
          if-no-files-found: error
  consolidate:
    needs: grade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'v23-gt-*'
          path: data/v2_3/ground_truth
      - name: Validate 7560 raw blind scores and prepare 2520 silver qrels
        run: python scripts/v23_gt_build.py
      - uses: actions/upload-artifact@v4
        with:
          name: ax-v23-full-ai-silver-dev-qrels
          path: data/v2_3/ground_truth
          retention-days: 90
      - name: Commit audited AI silver labels to experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v2_3/ground_truth
          git commit -m 'data(v2.3): archive 3 independent blind AI passes and silver Dev qrels'
          git push
