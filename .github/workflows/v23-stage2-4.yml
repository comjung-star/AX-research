name: AX v2.3 Stage 2-4 sequential experiments
on:
  push:
    branches: [experiment/v23-stage1-to-stage4-20261023]
    paths:
      - 'experiments/v23_stages/stage1/RESULT.md'
      - '.github/workflows/v23-stage2-4.yml'
permissions:
  contents: write
jobs:
  stage2-through-stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-v23-cpu
      - name: Install CPU and experiment packages
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers>=3.0' 'kiwipiepy>=0.20' 'rank-bm25>=0.2.2' 'openai>=3.26.0' 'pydantic>=2.7' 'numpy>=1.26' 'scikit-learn>=1.5'
      - name: Stage 2-1 equal views, 2-2 LOQO gates, 2-3 Hybrid, 2-4 interaction MLP
        run: python scripts/v23_stage2.py
      - name: Stage 2 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-stage2-results
          path: experiments/v23_stages/stage2
          retention-days: 90
          if-no-files-found: warn
      - name: Persist Stage 2 outputs separately
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_stages/stage2
          git commit -m 'results(v2.3): Stage2 controlled ablations, four sub-stages and LOQO'
          git pull --rebase
          git push
      - name: Stage 3 factor–strategy Wald and evidence source tracing
        run: python scripts/v23_stage3.py
      - name: Stage 3 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-stage3-results
          path: experiments/v23_stages/stage3
          retention-days: 90
          if-no-files-found: warn
      - name: Persist Stage 3 outputs separately
        run: |
          git add experiments/v23_stages/stage3
          git commit -m 'results(v2.3): Stage3 Wald and perspective-case-factor-strategy evidence trace'
          git pull --rebase
          git push
      - name: Stage 4 evidence fusion and LLM source-grounded recommendation
        run: python scripts/v23_stage4.py
      - name: Stage 4 result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-stage4-results
          path: experiments/v23_stages/stage4
          retention-days: 90
          if-no-files-found: warn
      - name: Persist Stage 4 outputs separately
        run: |
          git add experiments/v23_stages/stage4
          git commit -m 'results(v2.3): Stage4 audited evidence fusion LLM recommendation'
          git pull --rebase
          git push
      - name: Verify all four actual stage outputs against v2.3 frozen corpus
        run: python scripts/v23_verify_stages.py
      - name: Persist final four-stage verification report
        if: success()
        run: |
          git add experiments/v23_stages/ALL_STAGES_VERIFICATION.md
          git commit -m 'results(v2.3): four-stage reproducible Dev experiment verification'
          git pull --rebase
          git push
