name: Check OpenAI API secret availability

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-openai-secret.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence without exposing value
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          key = os.environ.get("OPENAI_API_KEY", "")
          print("OPENAI_API_KEY_PRESENT=" + ("yes" if bool(key.strip()) else "no"))
          sys.exit(0 if key.strip() else 2)
          PY
