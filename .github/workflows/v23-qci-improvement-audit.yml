name: AX v2.3 QCI improvement experiments
on:
  push:
    branches:
      - experiment/v23-qci-improvement-audit-20261024
    paths:
      - .github/workflows/v23-qci-improvement-audit.yml
      - scripts/v23_qci_improvement_audit.py
      - tests/test_v23_qci_improvement_audit.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qci-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated reproducibility dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . numpy pytest
      - name: Audit unit tests
        run: python -m pytest -q tests/test_v23_qci_improvement_audit.py
      - name: Actual frozen full84 QCI ablations
        run: python -m scripts.v23_qci_improvement_audit
      - name: Preserve results in experiment branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_qci_improvement_audit/
          git diff --cached --quiet && exit 0
          git commit -m 'results: frozen QCI projection, silver-label and RankNet comparison'
          git push
      - name: Archive raw study
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qci-improvement-ablation-results
          path: experiments/v23_qci_improvement_audit/
          if-no-files-found: warn
