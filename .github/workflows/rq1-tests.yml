name: RQ1 Python tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements-rq1.txt"
      - ".github/workflows/rq1-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "configs/**"
      - "pyproject.toml"
      - "requirements-rq1.txt"
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest PyYAML pydantic numpy

      - name: Run unit tests
        run: pytest -q
