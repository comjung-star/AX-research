name: AX v2.3 dynamic runtime perspective 8148 blind AI relevance
on:
  push:
    branches:
      - experiment/v23-runtime-perspective-qrels-20261024
    paths:
      - .github/workflows/v23-runtime-perspective-qrels.yml
      - scripts/v23_runtime_view_grade.py
      - scripts/v23_runtime_view_build.py
      - tests/test_v23_runtime_perspective_qrels.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pydantic>=2.7' pytest
      - run: PYTHONPATH=src:. python -m pytest -q tests/test_v23_runtime_perspective_qrels.py
  grade:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        query: [V21D001, V21D002, V21D003, V21D004, V21D005, V21D006, V21D007, V21D008, V21D009, V21D010]
        repeat: [1, 2, 3]
        pass: [1, 2]
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'openai>=3.26.0' 'pydantic>=2.7'
      - name: Grade actual dynamic views and all 84 cases without old relevance labels
        run: |
          python scripts/v23_runtime_view_grade.py \
            --query-id ${{ matrix.query }} \
            --run-id ${{ matrix.repeat }} \
            --pass-id ${{ matrix.pass }} \
            --model gpt-6-luna \
            --chunk-size 12
      - name: Keep raw blind API labels for consolidation
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: v23-dynamic-${{ matrix.query }}-run${{ matrix.repeat }}-pass${{ matrix.pass }}
          path: experiments/v23_runtime_perspective_qrels/raw_passes/${{ matrix.query }}-run${{ matrix.repeat }}-pass${{ matrix.pass }}/
          retention-days: 90
          if-no-files-found: error
  consolidate:
    needs: grade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          pattern: v23-dynamic-*
          path: experiments/v23_runtime_perspective_qrels/raw_passes/
      - name: Validate 16296 real blind judgments and build 8148 qrels
        run: python scripts/v23_runtime_view_build.py
      - name: Upload validated dynamic-view training and audit dataset
        uses: actions/upload-artifact@v4
        with:
          name: ax-v23-runtime-view-8148-silver-dataset
          path: experiments/v23_runtime_perspective_qrels/
          retention-days: 90
      - name: Commit AI-Silver mappings only to isolated experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_runtime_perspective_qrels/
          git diff --cached --quiet && exit 0
          git commit -m 'data(v2.3): audited 8148 dynamic runtime view/case AI silver pair labels'
          git push
