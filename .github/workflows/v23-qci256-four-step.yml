name: AX v23 four-step 256D QCI LOQO ranking audit
on:
  push:
    branches:
      - experiment/v23-qci-256-four-step-20261024
    paths:
      - .github/workflows/v23-qci256-four-step.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  model-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU training requirements
        run: |
          python -m pip install numpy pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Guard data leakage and QCI gate validity
        run: python -m pytest -q tests/test_v23_four_step_qci256.py
      - name: Train and test 10 held-out business queries
        run: python -m scripts.v23_four_step_qci256
      - name: Commit stage 3 and 4 results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add experiments/v23_qci256_four_step/
          git diff --cached --quiet && exit 0
          git commit -m 'results: 256d gated QCI versus Dense on same runtime-view AI Silver'
          git pull --rebase
          git push
      - name: Save validated audit files
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-256-gated-qci-dev-results
          path: experiments/v23_qci256_four_step/
          if-no-files-found: warn
