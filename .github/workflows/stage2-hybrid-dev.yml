name: Stage 2-3 Hybrid Retrieval Dev Experiment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stage2-hybrid-dev.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage2-hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hybrid-only dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "PyYAML>=6.0" "kiwipiepy>=0.20" "rank-bm25>=0.2.2" "pytest>=8.0"

      - name: Run hybrid unit tests
        run: |
          pytest -q tests/test_stage2_hybrid_runner.py tests/test_selection.py tests/test_evaluation.py

      - name: Run Stage 2-3 Hybrid Retrieval
        run: |
          python -m ax_research.stage2_hybrid_cli \
            --config configs/experiment_stage2_hybrid_v1.yaml \
            --output-dir experiments/rq2_multiview/results/stage2_hybrid_v1

      - name: List result files
        if: always()
        run: |
          find experiments/rq2_multiview/results/stage2_hybrid_v1 -maxdepth 1 -type f -print 2>/dev/null || true

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage2-hybrid-v1-results
          path: experiments/rq2_multiview/results/stage2_hybrid_v1
          if-no-files-found: warn

      - name: Persist successful results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rq2_multiview/results/stage2_hybrid_v1
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "results: add Stage 2-3 hybrid retrieval Dev experiment"
            git push
          fi
