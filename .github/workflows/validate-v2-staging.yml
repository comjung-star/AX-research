name: AX Dataset v2 Staging Integrity

on:
  pull_request:
    paths:
      - "data/v2/**"
      - "scripts/validate_v2_dataset.py"
      - ".github/workflows/validate-v2-staging.yml"
  push:
    paths:
      - "data/v2/**"
      - "scripts/validate_v2_dataset.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate staging parent-child lineage and unapproved state
        run: python scripts/validate_v2_dataset.py
