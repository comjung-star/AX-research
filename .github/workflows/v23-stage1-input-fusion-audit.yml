name: AX v2.3 Stage1 input and fusion diagnostic
on:
  push:
    branches: [experiment/v23-stage1-input-fusion-audit-20261023]
    paths:
      - '.github/workflows/v23-stage1-input-fusion-audit.yml'
      - 'scripts/v23_stage1_input_fusion_audit.py'
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: v23-bge-m3-cpu-${{ runner.os }}
      - name: Install locked-comparison runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install numpy sentence-transformers
      - name: Verify corpus and Ground Truth invariants
        run: |
          python scripts/v23_validate_dataset.py
          python scripts/v23_gt_validate.py
          python -m py_compile scripts/v23_stage1_input_fusion_audit.py
      - name: Replay Stage 1 and execute 3x2 factorial
        run: |
          python scripts/v23_stage1_input_fusion_audit.py
      - name: Preserve experiment results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v23_dev/stage1_input_fusion_audit
          git commit -m "results(v2.3): controlled Stage1 query-input and branch-fusion diagnostics"
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-stage1-input-fusion-diagnostic
          path: experiments/v23_dev/stage1_input_fusion_audit
          retention-days: 90
          if-no-files-found: warn
