name: Stage 3-2A Perspective Provenance Dev

on:
  pull_request:
    paths:
      - "src/ax_research/stage3_perspective_provenance.py"
      - "tests/test_stage3_perspective_provenance.py"
      - ".github/workflows/stage3-provenance-dev.yml"
      - "docs/experiment-spec-stage3-perspective-provenance-v1.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage3-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependencies
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - name: Validate source-path reconstruction
        run: pytest -q tests/test_stage3_perspective_provenance.py
      - name: Reconstruct read-only Dev provenance
        run: python -m ax_research.stage3_perspective_provenance
      - name: Upload complete perspective evidence paths
        uses: actions/upload-artifact@v4
        with:
          name: stage3-perspective-provenance-v1
          path: experiments/rq3_evidence/results/stage3_provenance_v1/
          if-no-files-found: error
