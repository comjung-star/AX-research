name: AX stage1 search integrity repair audit
on:
  push:
    branches: [research/stage1-stage2-integrity-20261108]
    paths:
      - .github/workflows/ax-stage1-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Smoke test validates retained letter/number tokens without assuming Kiwi segmentation boundaries.
      - name: Install actual frozen BM25 dependencies
        run: |
          python -m pip install kiwipiepy==0.24.1 rank-bm25==0.2.2 numpy==2.4.5
          python -m pip install -e .
      - name: Verify original scalar BM25 corpus and fix tokenizer in parallel version
        run: |
          PYTHONPATH=src:. python scripts/stage12_search_integrity.py build "$RUNNER_TEMP/stage1"
      - name: Diagnose corrected retrieval only after ranking sealed
        run: |
          PYTHONPATH=src:. python scripts/stage12_search_integrity.py score "$RUNNER_TEMP/stage1"
      - name: Preserve audited diagnostics on separate branch
        run: |
          mkdir -p docs/stage12-integrity-20261108/stage1
          cp "$RUNNER_TEMP/stage1/"*.json docs/stage12-integrity-20261108/stage1/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/stage12-integrity-20261108/stage1
          git commit -m "audit: repair English BM25 indexing and verify new20 retrieval diagnostics"
          git push origin HEAD:research/stage1-stage2-integrity-20261108
      - name: Save independently inspectable source artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-repaired-search-audit
          path: ${{ runner.temp }}/stage1
          if-no-files-found: warn
