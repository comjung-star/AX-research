name: AX v2.3 professor hybrid preserving replay
on:
  push:
    branches:
      - experiment/v23-professor-hybrid-preserving-20261024
    paths:
      - .github/workflows/v23-professor-hybrid-preserving.yml
      - scripts/v23_professor_hybrid_preserving.py
      - tests/test_v23_professor_hybrid_preserving.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install replay dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . numpy pytest
      - name: Run deterministic selection tests
        run: python -m pytest -q tests/test_v23_professor_hybrid_preserving.py
      - name: Re-evaluate frozen v2.3 professor hybrid (no LLM calls)
        run: python scripts/v23_professor_hybrid_preserving.py
      - name: Save separate experiment outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v23_hybrid_preserving/
          git diff --cached --quiet && exit 0
          git commit -m "results(v2.3): professor hybrid preserving candidate replay"
          git push
      - name: Upload diagnostic outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v23-professor-hybrid-preserving
          path: experiments/v23_hybrid_preserving/
          if-no-files-found: warn
