name: AX v2.3 Stage1 input and merger diagnostic

on:
  push:
    branches: [experiment/v23-stage1-input-merge-20261024]
    paths:
      - '.github/workflows/v23-stage1-input-merge-diagnostic.yml'
      - 'scripts/v23_stage1_input_merge_diagnostic.py'
      - 'docs/v23-stage1-input-merge-protocol-2026-10-24.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage1-input-and-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Free disk and cache encoder
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-m3-${{ runner.os }}
      - name: Install frozen Stage1 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e .
          python -m pip install -r requirements-rq1.txt
      - name: Verify frozen v2.3 corpus and reference scores
        run: |
          python scripts/v23_validate_dataset.py
          python scripts/v23_gt_validate.py
      - name: Perform exact Stage1 control replay and 6-factor diagnostic
        run: |
          python scripts/v23_stage1_input_merge_diagnostic.py
      - name: Persist full diagnosis, ranked cases and statistical comparisons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v23_dev/stage1_input_merge_diagnostic/
          git diff --cached --quiet && { echo "No results produced"; exit 1; }
          git commit -m 'results(v2.3): controlled Stage 1 input vs merger factorial diagnostic'
          git push
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v23-stage1-input-merge-results
          path: experiments/v23_dev/stage1_input_merge_diagnostic/
          if-no-files-found: warn
          retention-days: 90
