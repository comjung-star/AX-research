name: Persist successful RQ1 baseline artifact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rq1-persist-baseline-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download previously validated baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: rq1-baseline-results
          path: experiments/rq1_retrieval/results/rq1_v1_2_baseline
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 39570488930

      - name: Persist results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/rq1_retrieval/results/rq1_v1_2_baseline
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "results: persist validated RQ1 v1.2 baselines"
            git push
          fi
